    <!-- GitHub Pages SPA redirect script -->
    <script>
      // This script handles GitHub Pages redirect for single-page apps.
      // When a 404 occurs (direct URL navigation), GitHub Pages redirects to 404.html
      // which redirects back here with the path encoded in the query string.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
