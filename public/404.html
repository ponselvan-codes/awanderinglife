<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>India PPC &amp; Philately Passport Collection</title>
    <script>
      // GitHub Pages SPA 404 redirect.
      // This script redirects all routes to the index page with the path
      // encoded in the query string, which index.html then decodes.
      // Source: https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1; // Keep the repository name segment
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!-- GitHub Pages 404 handler for single-page app routing -->
    <!-- This page is never shown to the user; it redirects immediately -->
  </body>
</html>
